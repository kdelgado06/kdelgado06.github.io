<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Volunteer Form</title>
</head>


<body>

<h1>Volunteer Form</h1>

<form action="http://bloomingdale.sat.iit.edu/kriedan/lab3formscript.php" method="post">
	
	<fieldset>
		<legend>My Info</legend>

	
		<!-- FIRST NAME -->
		<label for="first_name_field">first name:</label>
		<input type="text" id="first_name_field" name="first_name_field"><br>

		<!-- LAST NAME -->
		<label for="last_name_field">last name:</label>
		<input type="text" id="last_name_field" name="last_name_field"><br>

		<label for="phone_field">phone:</label>
		<input type="tel" id="phone_field" name="phone_field"><br>

		<label for="email_field">email:</label>
		<input type="email" id="email_field" name="email_field"><br>

		<span>Gender:</span>
		<input type="radio" id="male" name="gender_field" value="male">
		<label for="male">Male</label>
		<input type="radio" id="female" name="gender_field" value="female">
		<label for="female">Female</label><br>

		<label for="age_field">Age:</label><br>
		<select id="age_field" name="age_field">
			<option value="under 18">under 18</option>
			<option value="over 18">over 18</option>
		</select>
	
</fieldset>

<fieldset>
	<legend>My Availability</legend>

	<h3>Days Available:</h3>

	<input type="checkbox" id="monday" name="days_available_field[]" value="Monday">
	<label for="monday">Monday</label><br>

	<input type="checkbox" id="tuesday" name="days_available_field[]" value="Tuesday">
	<label for="tuesday">Tuesday</label><br>

	<input type="checkbox" id="wednesday" name="days_available_field[]" value="Wednesday">
	<label for="wednesday">Wednesday</label><br>

	<input type="checkbox" id="thursday" name="days_available_field[]" value="Thursday">
	<label for="thursday">Thursday</label><br>

	<input type="checkbox" id="friday" name="days_available_field[]" value="Friday">
	<label for="friday">Friday</label><br>

</fieldset>

<fieldset>
	<legend>Comments</legend>
	<textarea id="comments_field" name="comments_field" rows="5" cols="30"></textarea><br>

</fieldset>

<input type="hidden" name="hidden_field" value="Katie Delgado">	

<p>
	<input type="submit" value="Submit Query”">
</p>

</form>	

</body>
</html>
